# Local production-shaped stack. Postgres here, SQLite is only for quick local
# runs without Docker.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: srg_admin
      POSTGRES_USER: srg
      POSTGRES_PASSWORD: srg-local-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srg -d srg_admin"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://srg:srg-local-password@db:5432/srg_admin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Migrations run on start rather than in the image build: the build has no
    # database, and running them per-deploy keeps schema and code together.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --access-logfile -"

volumes:
  pgdata:
